; Rocket motor DAQ: TAS501 load cell + ADS1220 + Arduino Nano ESP32 + Adafruit MicroSD (ADA254)
;
;   pio run -e rocket_daq -t upload       main thrust logger
;   pio run -e diagnostic -t upload       ADS1220 wiring check
;   pio device monitor                    serial console (115200)

[platformio]
default_envs = rocket_daq

[env]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes

[env:rocket_daq]
build_src_filter = +<daq/>

[env:diagnostic]
build_src_filter = +<diag/>
